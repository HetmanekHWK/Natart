<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NatArt - Soon</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at center, #151515 0%, #050505 55%, #000 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
}

.scene {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Obrazek logo */
.logo-img {
    width: min(75vw, 720px);
    max-height: 75vh;
    object-fit: contain;
    position: relative;
    z-index: 5;
    animation: logoFloat 5s ease-in-out infinite, logoGlow 3s ease-in-out infinite alternate;
}

/* Złoty obracający się ring */
.ring {
    position: absolute;
    width: min(62vw, 560px);
    height: min(62vw, 560px);
    border-radius: 50%;
    border: 2px solid rgba(212, 175, 55, 0.45);
    box-shadow:
        0 0 35px rgba(212, 175, 55, 0.45),
        inset 0 0 30px rgba(255,255,255,0.18);
    animation: rotateRing 12s linear infinite;
    z-index: 2;
}

.ring::after {
    content: "";
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.25);
}

/* Fale w tle */
.wave {
    position: absolute;
    width: 130vw;
    height: 240px;
    border-top: 1px solid rgba(212,175,55,0.35);
    border-radius: 50%;
    z-index: 1;
}

.wave.one {
    top: 45%;
    left: -20%;
    animation: waveMoveOne 7s ease-in-out infinite alternate;
}

.wave.two {
    top: 55%;
    right: -20%;
    border-top-color: rgba(255,255,255,0.22);
    animation: waveMoveTwo 8s ease-in-out infinite alternate;
}

/* Cząsteczki */
.particles span {
    position: absolute;
    bottom: -20px;
    width: 4px;
    height: 4px;
    background: #d4af37;
    border-radius: 50%;
    box-shadow: 0 0 12px #d4af37;
    animation: particleUp 7s linear infinite;
    z-index: 3;
}

.particles span:nth-child(1) { left: 10%; animation-delay: 0s; }
.particles span:nth-child(2) { left: 22%; animation-delay: 1s; }
.particles span:nth-child(3) { left: 35%; animation-delay: 2s; }
.particles span:nth-child(4) { left: 50%; animation-delay: 3s; }
.particles span:nth-child(5) { left: 63%; animation-delay: 4s; }
.particles span:nth-child(6) { left: 78%; animation-delay: 5s; }
.particles span:nth-child(7) { left: 90%; animation-delay: 6s; }

/* Animacje */
@keyframes logoFloat {
    0%, 100% {
        transform: translateY(0) scale(1);
    }
    50% {
        transform: translateY(-18px) scale(1.02);
    }
}

@keyframes logoGlow {
    from {
        filter: drop-shadow(0 0 10px rgba(212,175,55,0.35));
    }
    to {
        filter: drop-shadow(0 0 35px rgba(212,175,55,0.9));
    }
}

@keyframes rotateRing {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

@keyframes waveMoveOne {
    from {
        transform: translateX(-60px) rotate(3deg);
    }
    to {
        transform: translateX(60px) rotate(-3deg);
    }
}

@keyframes waveMoveTwo {
    from {
        transform: translateX(60px) rotate(-4deg);
    }
    to {
        transform: translateX(-60px) rotate(4deg);
    }
}

@keyframes particleUp {
    0% {
        transform: translateY(0) scale(0.5);
        opacity: 0;
    }
    20% {
        opacity: 1;
    }
    100% {
        transform: translateY(-110vh) scale(1.2);
        opacity: 0;
    }
}

/* Telefon */
@media (max-width: 600px) {
    .logo-img {
        width: 95vw;
    }

    .ring {
        width: 85vw;
        height: 85vw;
    }
}
</style>
</head>

<body>

<div class="scene">

    <div class="particles">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div class="wave one"></div>
    <div class="wave two"></div>

    <div class="ring"></div>

    <img src="natart.png" alt="NatArt Soon" class="logo-img">

</div>

</body>
</html>
