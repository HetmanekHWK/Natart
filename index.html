<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NatArt - Soon</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    background: #000;
}

.bg {
    position: fixed;
    inset: 0;
    background-image: url("natart.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    animation: slowZoom 10s ease-in-out infinite alternate;
}

.overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle, transparent 35%, rgba(0,0,0,0.45) 100%);
    pointer-events: none;
}

.glow {
    position: fixed;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -55%);
    border: 1px solid rgba(212,175,55,0.35);
    box-shadow: 0 0 50px rgba(212,175,55,0.5);
    animation: rotate 12s linear infinite, pulse 3s ease-in-out infinite;
}

.particles span {
    position: fixed;
    bottom: -20px;
    width: 4px;
    height: 4px;
    background: #d4af37;
    border-radius: 50%;
    box-shadow: 0 0 12px #d4af37;
    animation: particles 7s linear infinite;
}

.particles span:nth-child(1) { left: 10%; animation-delay: 0s; }
.particles span:nth-child(2) { left: 25%; animation-delay: 1s; }
.particles span:nth-child(3) { left: 40%; animation-delay: 2s; }
.particles span:nth-child(4) { left: 60%; animation-delay: 3s; }
.particles span:nth-child(5) { left: 75%; animation-delay: 4s; }
.particles span:nth-child(6) { left: 90%; animation-delay: 5s; }

@keyframes slowZoom {
    from {
        transform: scale(1);
        filter: brightness(0.9);
    }
    to {
        transform: scale(1.06);
        filter: brightness(1.15);
    }
}

@keyframes rotate {
    from {
        transform: translate(-50%, -55%) rotate(0deg);
    }
    to {
        transform: translate(-50%, -55%) rotate(360deg);
    }
}

@keyframes pulse {
    0%, 100% {
        opacity: 0.35;
    }
    50% {
        opacity: 1;
    }
}

@keyframes particles {
    0% {
        transform: translateY(0);
        opacity: 0;
    }
    20% {
        opacity: 1;
    }
    100% {
        transform: translateY(-110vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>
<div class="glow"></div>

<div class="particles">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>

</body>
</html>
